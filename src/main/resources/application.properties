spring.application.name=odontosys
#api.security.token.secret=${JWT_SECRET:my-secret-key}
# ===================================
# CONFIGURAÇÃO DO BANCO DE DADOS (POSTGRESQL)
# ===================================

# URL de conexão: altere 'nome_do_seu_banco' para o nome da base criada no Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/odontosys

# Usuário e Senha do PostgreSQL (padrão costuma ser 'postgres')
spring.datasource.username=postgres
spring.datasource.password=123

# Driver JDBC
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================
# CONFIGURAÇÕES DO HIBERNATE / JPA
# ===================================

# Dialeto do PostgreSQL para o Hibernate gerar as consultas corretas
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cria/Atualiza as tabelas automaticamente no banco a partir das suas entidades Java:
# - update: altera o esquema do banco sem apagar dados existentes (recomendado para dev)
# - create-drop: recria o banco do zero a cada inicialização da aplicação
# - validate: apenas valida se a estrutura do banco bate com as classes Java
# - none: desativa a alteração automática
spring.jpa.hibernate.ddl-auto=update

# Exibe as consultas SQL geradas no console do Spring (útil para depuração)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
