<!DOCTYPE html>
<html lang="pt" xmlns:th="http://thymeleaf.org" xmlsn:layout="http://www.utraq.net.nz/thymeleaf/layout">
    <head>
        <!-- Importa o CSS e o título dinâmico do fragmento 'cabecalho' -->
        <th:block th:replace="~{fragments/template :: cabecalho('Cadastro de Pacientes')}"></th:block>
    </head>
    
    <body>
    
        <!-- Importa o Menu Padrão -->
        <header th:replace="~{fragments/template :: menu}"></header>
    
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-custom p-4">
                  
                    <h3 th:text="${funcionario.id != null} ? 'Editar Funcionario' : 'Novo Funcionario'" class="mb-4 text-primary"><i class="fa-solid fa-user-plus me-2"></i> Cadastrar Funcionario</h3>
                    <form th:action="@{/funcionario/salvar}" th:object="${funcionario}" method="post">
                        <div class="row g-3">
                            <!-- IMPORTANTE: Campo oculto que armazena o ID para permitir a edição -->
                            <input type="hidden" th:field="*{id}" />
                            <div class="col-md-6">
                                <label class="form-label">Nome Completo *</label>
                                <input th:field="*{nome}" type="text" class="form-control" required placeholder="Ex: Maria Oliveira">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">CPF *</label>
                                <input type="text" th:field="*{cpf}" class="form-control" required placeholder="000.000.000-00">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Telefone *</label>
                                <input type="text" th:field="*{telefone}" class="form-control" required placeholder="(11) 99999-9999">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">E-mail *</label>
                                <input type="email" th:field="*{email}" class="form-control" required placeholder="exemplo@email.com">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">CRO *</label>
                                <input type="text" th:field="*{cro}" class="form-control" placeholder="CRO-SP-12345">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Especialidade </label>
                                <input type="text" th:field="*{especialidade}" class="form-control" placeholder="Ex: Endodontia">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Data de Nascimento *</label>
                                <input type="date" th:field="*{data_nascimento}" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Endereço *</label>
                                <input type="text" th:field="*{endereco}" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Senha </label>
                                <input type="password" th:field="*{senha}" class="form-control" placeholder="Ex: ******">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Perfil do Usuario</label>
                                <select th:field="*{perfil}" class="form-select" required>
                                    <option value="">Defina o perfil de Acesso ao sistema *</option>
                                    <option value="dentista">DENTISTA</option>
                                    <option value="secretaria">SECRETARIA</option>
                                </select>
                            </div>
                            <div class="col-12 text-end mt-4">
                                <a th:href="@{/funcionario/listar} class="btn btn-secondary me-2">Cancelar</a>
                                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i> Salvar Funcionario</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="mb-5">
            
        </div>
    </main>

    <!-- FRAGMENTO DO RODAPÉ -->
    <footer th:fragment="rodape" class="footer bg-secondary mt-auto py-3 border-top text-center text-white fixed-bottom">
        <div class="container">
            <small>&copy; 2026 Consultório Odontológico OdontoSys - Todos os direitos reservados.</small>
        </div>
    </footer>
    

</body>
</html>
