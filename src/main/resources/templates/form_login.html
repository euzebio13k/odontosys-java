<!DOCTYPE html>
<html lang="pt" xmlns:th="http://thymeleaf.org" xmlsn:layout="http://www.utraq.net.nz/thymeleaf/layout">
    <head>
        <!-- Importa o CSS e o título dinâmico do fragmento 'cabecalho' -->
        <th:block th:replace="~{fragments/template :: cabecalho('Cadastro de Pacientes')}"></th:block>
    </head>
    <body>
        <!-- Importa o Menu Padrão -->
        <header th:replace="~{fragments/template :: menu}"></header>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-custom p-4">
                  
                    <h3 th:text="${user.id != null} ? 'Editar Funcionario' : 'Novo Funcionario'" class="mb-4 text-primary"><i class="fa-solid fa-user-plus me-2"></i> Cadastrar Funcionario</h3>
                    <form th:action="@{/auth/login}" th:object="${user}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">E-mail *</label>
                                <input type="email" th:field="*{email}" class="form-control" required placeholder="exemplo@email.com">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Senha </label>
                                <input type="password" th:field="*{password}" class="form-control" placeholder="Ex: ******">
                            </div>
                            <div class="col-12 text-end mt-4">
                                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i> Entrar</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="mb-5"> 
        </div>
    </main>
    <!-- FRAGMENTO DO RODAPÉ -->
    <footer th:fragment="rodape" class="footer bg-secondary mt-auto py-3 border-top text-center text-white fixed-bottom">
        <div class="container">
            <small>&copy; 2026 Consultório Odontológico OdontoSys - Todos os direitos reservados.</small>
        </div>
    </footer>
</body>
</html>
