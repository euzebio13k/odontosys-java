<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <th:block th:replace="~{fragments/template :: cabecalho('Lista de Pacientes')}"></th:block>
</head>

<body class="d-flex flex-column min-vh-100">

    <header th:replace="~{fragments/template :: menu}"></header>

    <main class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fa-solid fa-user-injured text-primary me-2"></i> Lista de Pacientes</h2>
            <a th:href="@{/paciente/cadastrar}" class="btn btn-primary"><i class="fa-solid fa-plus me-1"></i> Novo Paciente</a>
        </div>

        <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${param.sucesso}">
            Paciente salvo com sucesso!
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div class="card card-custom p-3">
            <!-- Formulário apontando para a rota de listagem -->
            <form th:action="@{/paciente/listar}" method="GET">
                <div class="row my-4">
                    <div class="col">
                        <label class="form-label">Buscar paciente</label>
                        <!-- Preserva o texto digitado na busca -->
                        <input type="text" name="busca" class="form-control" th:value="${busca}" placeholder="Digite o nome do paciente...">
                    </div>
                    <div class="col-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary me-2">Buscar</button>
                        <a th:href="@{/paciente/listar}" class="btn btn-outline-secondary" th:if="${busca != null and !busca.isEmpty()}">Limpar</a>
                    </div>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>Data de Nascimento</th>
                            <th>Telefone</th>
                            <th>E-mail</th>
                            <th>Convênio</th>
                            <th>Observação</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- th:each direto na tag <tr> -->
                        <tr th:each="paciente : ${pacientes}">
                            <td th:text="${paciente.nome}"></td>
                            <td th:text="${paciente.cpf}"></td>
                            <td th:text="${#temporals.format(paciente.data_nascimento, 'dd/MM/yyyy')}"></td>
                            <td th:text="${paciente.telefone}"></td>
                            <td th:text="${paciente.email}"></td>
                            <td th:text="${paciente.convenio}"></td>
                            <td th:text="${paciente.observacao}"></td>
                            <td class="text-end">
                                <a th:href="@{/paciente/editar/{id}(id=${paciente.id})}">
                                    <i class="fa-solid fa-pencil me-1"></i>
                                </a>
                                <a th:href="@{/paciente/excluir/{id}(id=${paciente.id})}"
                                   onclick="return confirm('Tem certeza que deseja excluir o Paciente?');">
                                    <i class="fa-solid fa-trash text-danger me-1"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(pacientes)}">
                            <td colspan="8" class="text-center text-muted py-3">Nenhum paciente encontrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/template :: rodape}"></footer>
</body>
</html>
